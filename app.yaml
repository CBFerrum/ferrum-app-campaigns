id: campaigns
name: Campaigns
version: 0.5.0
publisher: cbferrum
summary: "Email, text and chat-app marketing: topics and a preference page, segments over any data, campaigns with A/B tests, journeys on record events, revenue attribution, deliverability and consent"
description: README.md
categories: [marketing]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-campaigns
support: https://github.com/CBFerrum/ferrum-app-campaigns/issues
runtime: native
requires:
  comms: ">=0.13.1, <0.20"
platform: ">=0.3.2, <0.4"
packages: [campaigns]
uninstall: ask
# Its own interface at /campaigns/ (Ferrum docs/plan/apps-ui.md §13): a campaign written, previewed,
# tested, checked and sent from one page, its results as charts, and audiences (segments and file
# imports), in ui/ (built into ui/dist). The rest of its records stay in the records frame.
ui:
  dist: ui/dist
  # A preview shows an email as it will look, pictures included: the content points to them.
  csp:
    img: ["https:"]
contributes:
  shell.app:
    - id: campaigns
      route: campaigns
      title: Campaigns
      description: Email marketing, from the first draft to the results
      icon: megaphone
      color: "#a63089"
      roles: [Marketing User, Marketing Manager]
  shell.open:
    # Campaigns and segments open on their own pages; the rest of its records open in the frame.
    - {id: campaign, entity: EmailCampaign, path: "campaigns/c/{id}", list: campaigns/, priority: 1}
    - {id: segment, entity: MarketingSegment, path: "campaigns/s/{id}", list: campaigns/audiences, priority: 1}
    - {id: marketing, package: campaigns, path: "campaigns/e/{entity}/{id}", list: "campaigns/e/{entity}"}
  shell.create:
    - {id: campaign, label: Campaign, path: campaigns/new, entity: EmailCampaign}
    - {id: segment, label: Segment, path: campaigns/s/new, entity: MarketingSegment}
  # What the assistant should know in Campaigns's pages, and what it suggests asking there.
  shell.assistant:
    - id: campaigns
      title: "Campaigns"
      instructions: >-
        An EmailCampaign is Draft, Scheduled, Sending, Sent or Cancelled, and goes to its audience (CampaignAudience:
        segments and contacts). Each recipient's outcome is a CampaignRecipient: Pending, Held, Queued, Sent, Failed,
        Skipped or Cancelled. A contact on the suppression list (EmailSuppression) or without consent is skipped,
        never sent to. CampaignVariant rows are an A/B test's versions. A MarketingJourney (Draft, Active, Paused,
        Stopped) sends its steps over time to the contacts enrolled in it (JourneyEnrollment).
      suggestions:
        - "How did last month's campaigns do?"
        - "Which campaigns are scheduled this week?"
        - "How many recipients failed or were skipped in the last campaign, and why?"
        - "Which journeys are active, and how many people are in each?"
